name: CI

on:
  push:
    branches: [main, production-ready]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          POSTGREST_JWT_SECRET: ci-postgrest-jwt-secret-abcdefghijklmnopqrstuvwxyz-123456
          LOCAL_AUTH_SECRET: ci-local-auth-secret-abcdefghijklmnopqrstuvwxyz-123456
      - name: Smoke test self-hosted database schema
        run: |
          docker compose --env-file .env.example -f docker-compose.self-hosted.yml up -d db
          for i in $(seq 1 30); do
            if docker exec voyago-postgres pg_isready -U voyago -d voyago >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec voyago-postgres psql -U voyago -d voyago -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public';"
          docker exec voyago-postgres psql -U voyago -d voyago -v ON_ERROR_STOP=1 -c "SELECT id FROM local_users LIMIT 0; SELECT id FROM bookings LIMIT 0; SELECT id FROM payments LIMIT 0; SELECT id FROM pricing_rules LIMIT 0; SELECT id FROM quotations LIMIT 0;"
          docker compose --env-file .env.example -f docker-compose.self-hosted.yml down -v
