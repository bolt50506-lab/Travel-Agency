version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voyago}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-voyago}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  postgrest:
    image: postgrest/postgrest:v12.2.12
    depends_on:
      - db
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER:-voyago}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-voyago}
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${POSTGREST_JWT_SECRET}
    ports:
      - '3002:3000'
    restart: unless-stopped

  web:
    build: .
    depends_on:
      - postgrest
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      POSTGREST_URL: http://postgrest:3000
    restart: unless-stopped

volumes:
  pgdata:
