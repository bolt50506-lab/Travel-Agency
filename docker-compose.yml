services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voyago}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-voyago}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voyago} -d ${POSTGRES_DB:-voyago}"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  db-init:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voyago}
      POSTGRES_USER: ${POSTGRES_USER:-voyago}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGREST_DB_PASSWORD: ${POSTGREST_DB_PASSWORD:-change-this-postgrest-password}
    volumes:
      - ./self-hosted/bootstrap.sql:/bootstrap.sql:ro
      - ./self-hosted/schema.sql:/schema.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        export PGPASSWORD="$$POSTGRES_PASSWORD"
        psql -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -v ON_ERROR_STOP=1 -f /bootstrap.sql
        psql -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -v ON_ERROR_STOP=1 -f /schema.sql
        psql -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -v pgrest_password="$$POSTGREST_DB_PASSWORD" -v ON_ERROR_STOP=1 -c "ALTER ROLE authenticator PASSWORD :'pgrest_password';"
        echo "Self-hosted database initialization completed."
    restart: "no"

  postgrest:
    image: postgrest/postgrest:v12.2.12
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGREST_DB_PASSWORD:-change-this-postgrest-password}@db:5432/${POSTGRES_DB:-voyago}
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${POSTGREST_JWT_SECRET}
    ports:
      - '3002:3000'
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgrest:
        condition: service_started
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      POSTGREST_URL: http://postgrest:3000
    restart: unless-stopped

volumes:
  pgdata:
