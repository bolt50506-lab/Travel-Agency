services:
  db:
    image: postgres:16
    container_name: voyago-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voyago}
      POSTGRES_USER: ${POSTGRES_USER:-voyago}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-db-password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - voyago_pgdata:/var/lib/postgresql/data
      - ./self-hosted/00-roles.sh:/docker-entrypoint-initdb.d/000-roles.sh:ro
      - ./self-hosted/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voyago} -d ${POSTGRES_DB:-voyago}"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgrest:
    image: postgrest/postgrest:v14.2
    container_name: voyago-postgrest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGREST_DB_PASSWORD:-change-this-postgrest-password}@db:5432/${POSTGRES_DB:-voyago}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${POSTGREST_JWT_SECRET:-replace-with-a-long-random-secret-at-least-32-chars}
      PGRST_JWT_ROLE_CLAIM_KEY: .role
      PGRST_SERVER_HOST: 0.0.0.0
      PGRST_SERVER_PORT: 3000
      PGRST_OPENAPI_MODE: disabled
      PGRST_DB_MAX_ROWS: 1000
    ports:
      - "127.0.0.1:3001:3000"

volumes:
  voyago_pgdata:
